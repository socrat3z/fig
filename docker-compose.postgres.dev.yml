services:
  fig-postgres:
    image: postgres:17-alpine
    container_name: fig-postgres-dev
    environment:
      POSTGRES_DB: ${FIG_PG_DB:-fig}
      POSTGRES_USER: ${FIG_PG_USER:-fig_user}
      POSTGRES_PASSWORD: ${FIG_PG_PASSWORD:-fig_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - fig-pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  fig-api:
    container_name: fig-api-dev
    build:
      context: ./src
      dockerfile: api/Fig.Api/Dockerfile
    image: fig-api:dev
    depends_on:
      fig-postgres:
        condition: service_healthy
    environment:
      - ApiSettings__DbConnectionString=Host=fig-postgres;Port=5432;Database=${FIG_PG_DB:-fig};Username=${FIG_PG_USER:-fig_user};Password=${FIG_PG_PASSWORD:-fig_password_change_me};SSL Mode=Disable
    ports:
      - "7281:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_health"]
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 3

  fig-web:
    container_name: fig-web-dev
    build:
      context: ./src
      dockerfile: web/Fig.Web/Dockerfile
    image: fig-web:dev
    depends_on:
      fig-api:
        condition: service_healthy
    environment:
      - FIG_API_URI=http://localhost:7281
    ports:
      - "7148:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 3

volumes:
  fig-pg-dev-data:
